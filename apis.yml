name: Slice
kind: company
description: Slice is a done-for-you online ordering, marketing, payments, and
  point-of-sale platform for independent pizzerias, serving more than 19,000 shops
  across all 50 states and 3,000+ cities. Consumers order through slicelife.com and
  the Slice apps; shop owners run their business through slice.com, the Owner's
  Portal (owners.slicelife.com), and the Slice Register POS. Slice does publish a
  developer portal titled "Slice Public API" at developer.slicelife.com (built on
  Stoplight) and a separate merchant/banking API portal at developer.slicebank.com,
  but neither is an open, self-serve API - there is no public API-key signup and the
  endpoint reference is not openly rendered or documented for third parties. API
  access is partner-gated and arranged through Slice's partnerships team
  (partner@slicelife.com). The APIs listed below are logical groupings modeled from
  the platform's known merchant surfaces (shops, menus, orders, customers); no
  public OpenAPI definition is available, so no specification is included.
